; ============================================================================
; FIFA 16 - dinput8 Linie 9 (ab L9.37) - Einstellungen
; Liegt neben dinput8.dll im Spielverzeichnis. Wird bei jedem Spielstart
; einmal gelesen; das Ergebnis steht in dinput8_L9.log.
;
; Regeln fuer [Saisonziele]
;  - Kategorien A bis F. FIFA kennt genau diese sechs.
;  - IDs durch Komma oder Leerzeichen getrennt. Eine Kategorie darf in
;    mehreren Zeilen stehen, die IDs werden aneinandergehaengt.
;  - Kommentar mit ; oder # bis Zeilenende.
;  - Jede Liga-ID darf nur in EINER Kategorie stehen.
;  - Hoechstens 256 IDs je Kategorie.
;  - Leere oder fehlende Kategorie: FIFA-Standard dieser Kategorie bleibt.
;  - Irgendein Fehler (Tippfehler, doppelte ID ...): die GANZE Sektion wird
;    verworfen, alle sechs Kategorien bleiben FIFA-Standard. Das Log nennt
;    Zeile und Spalte.
;  - Aktiv=0 schaltet den Patch ab (dann laeuft nur Rahmen + Inventur).
;  - Als ANSI oder UTF-8 speichern, nicht als UTF-16 (Unicode).
;
; Aktueller Inhalt: Stand Linie 6 / saisonziele.txt (A=31 B=17 C=61 D=18
; E=31 F=14, 172 IDs). IDs, die es in der geladenen Datenbank nicht gibt,
; sind wirkungslos, aber unschaedlich.
; ============================================================================

[Saisonziele]
