; ============================================================================
; [LandRegion] - L9-02: Rueckfallregion fuer Laender ohne Regionseintrag
;  Die Land->Region-Suche (exe+0x59469B8) liefert fuer ein Land, das in keiner
;  Regionsliste steht, -1. Mit dem Patch wird daraus die hier genannte Region.
;  - Region = 0 bis 8. Erprobt sind 3 (Linie 3) und 7 (Linie 6).
;  - Aktiv=0 oder fehlende Sektion: Stelle bleibt original (Rueckgabe -1).
;  - Fehler in dieser Sektion verwerfen nur L9-02, nicht die Saisonziele.
; ============================================================================

[LandRegion]
Aktiv=1
Region=7

; ============================================================================
; [SpielerIDBasis] - L9-03: Startwert fuer die IDs erzeugter Spieler
;  Die Karriere sucht fuer neu erzeugte Spieler (Jugend, Regens) die erste
;  freie playerid ab diesem Wert (exe+0x5BB985E, FIFA-Standard 280000).
;  - Basis = 280000 bis 500000. Echte Spieler muessen darunter liegen.
;  - Die Datenbank muss playerid-Werte oberhalb der Basis zulassen
;    (rangehigh der Spieler-ID-Felder, siehe README).
;  - Wirkt nur fuer neu erzeugte Spieler; bereits erzeugte behalten ihre ID.
;  - Aktiv=0 oder fehlende Sektion: Stelle bleibt original (280000).
;  - Fehler in dieser Sektion verwerfen nur L9-03.
;  - Nur L9.6 und spaeter lesen diese Sektion; L9.5 ueberliest sie.
; ============================================================================

[SpielerIDBasis]
Aktiv=1
Basis=460000

; ============================================================================
; [ScoutRegionen] - L9-04: die neun Laenderlisten des Scout-Netzwerks
;  Aktiv=1 setzt die 157 Laender in Kartenreihenfolge (Standard).
;  Aktiv=0 laesst die Vanilla-Listen mit 54 Laendern stehen - zum Vergleichen.
; ============================================================================

[ScoutRegionen]
Aktiv=1

; ============================================================================
; [ScoutOhneLiga] - L9-05: Laender ohne eigene Liga im GTN-Menue zeigen
;  Das GTN-Menue fragt fuer jedes Land, ob es dazu eine Liga gibt
;  (exe+0x593D580). Laender ohne Liga verschwinden deshalb aus der Auswahl.
;  Aktiv=1 laesst diese Pruefung immer "ja" antworten.
;  Betrifft nur das Scout-Netzwerk; das Jugendscouting kennt diese Pruefung
;  ohnehin nicht. Standard ist 0.
; ============================================================================

[ScoutOhneLiga]
Aktiv=0

; ============================================================================
; [Ligenblock] - L9-06: Ligenplaetze je Nation von 5 auf 11 erhoehen
;  Das Ligenmenue haelt je Nation einen Block fester Groesse: ein Kopf plus
;  fuenf Ligenplaetze (0x1B0). Ein Land mit mehr Ligen laeuft in den Block des
;  naechsten Landes. Der Patch vergroessert den Block auf 0x360, also Kopf plus
;  ELF Ligen, an 77 gemessenen Stellen.
;  - Im Spiel bestaetigt: England mit sieben Ligen, GTN und Ligenmenue korrekt.
;  - Setzt das Log nicht "77 von 77", darf nicht weitergespielt werden.
; ============================================================================

[Ligenblock]
Aktiv=1

; ============================================================================
; [Namensweiche] - L9-07: Grenze zwischen playernames und dcplayernames
;  Vanilla: playernames 0..28999, dcplayernames 29000..32766.
;  Der Patch verschiebt die Weiche auf 60000 und hebt das Ende des zweiten
;  Bereichs auf 119999. Achtzehn Immediates in sechs Bloecken.
;  - Nur mit einer Datenbank einschalten, die dazu passt:
;      playernames.nameid   0..59999   (16 Bit)
;      dcplayernames.nameid 60000..119999 (17 Bit, rangehigh 120000)
;      players: die vier Namensfelder 17 Bit, rangehigh 120000
;  - Setzt das Log nicht "18/18", darf nicht weitergespielt werden.
;  - Standard ist 0.
; ============================================================================

[Namensweiche]
Aktiv=0

; ============================================================================
; [Poolwache] - L9-S11: liest die 54 Speicherpools und meldet Aenderungen
;  Reine Messung, kein Eingriff. Momentaufnahmen nach 5, 20, 60 und 180 s,
;  dazwischen jede Aenderung von Basis oder Groesse. Ein Pool, dessen Basis
;  auf null faellt, wird als ABGERAEUMT gemeldet.
;  Fuer den Lauf mit grosser Datenbank und winmm-Kapazitaeten einschalten.
; ============================================================================

[Poolwache]
Aktiv=0

; ============================================================================
; [Entlinkwaechter] - L9-08: faengt das Aushaengen unverketteter Knoten ab
;  exe+0x5813923 und exe+0x5813934 schreiben Nachbarzeiger ohne Pruefung.
;  Der Waechter ueberspringt den Schreibzugriff, wenn der Zeiger null oder
;  unplausibel ist. Standard 1.
;  Zum Pruefen, ob L9-09 den Waechter ueberfluessig macht: auf 0 setzen.
; ============================================================================

[Entlinkwaechter]
Aktiv=1

; [Turnierliste] - L9-10: Complist (Turniere/Wettbewerbe) von 300 auf 400 Plaetze
;   Aus Linie 6 uebernommen (p16 Suchgrenze + P17 Objekt, zusammen 61 Stellen).
;   Setzt voraus, dass die Compdata-Tabellen genug Platz haben (winmm.dll von Linie 6).
;   Aktiv=0 schaltet L9-10 ganz ab (dann gilt wieder die Vanilla-Grenze).
[Turnierliste]
Aktiv=1

; [SpielerCache] - L9-11: Spieler-Cache beim Karrierestart fuer mehr als 32767 Spieler
;   (wie "div6" in Linie 6). Ohne diese Korrektur laeuft die Cache-Schleife bei
;   grossen Datenbanken endlos und die Karriere stuerzt beim Generieren ab.
[SpielerCache]
Aktiv=1

; [FCEWaechter] - L9-12: zwei NULL-Waechter in der FootballCompEngzf.dll (wie P67 in Linie 6)
;   FCE+6A122 (Turniermodus, StageInfo) und FCE+34D27 (Baumsuche). Im Nullfall wird der
;   spieleigene Ausweg genommen; das Log meldet, wie oft ein Waechter gegriffen hat.
[FCEWaechter]
Aktiv=1

; [NullGetter] - L9-13: Waechter auf den gemeinsamen Getter exe+4468CF0 (wie "crash-guard"
;   in Linie 6). Liefert eine Abfrage kein Objekt, gibt der Getter 0 zurueck statt abzustuerzen.
;   Das Log meldet, wie oft und von wo er gegriffen hat.
[NullGetter]
Aktiv=1

; [Tokenpool] - L9-14: groessere Tokenfelder fuer Datenbankabfragen (wie P66 in Linie 6).
;   Jeder neue Abfragebauer bekommt einen eigenen Block mit 8192 statt 512 Plaetzen
;   (32 Bloecke). Ohne das zerbrechen grosse Abfragen der erweiterten DB, z. B. nach dem Speichern.
[Tokenpool]
Aktiv=1

; [Knotenablage] - L9-15: Ablage fuer die Ausdrucksknoten des WHERE-Parsers von 128 auf 8192
;   Knoten je Abfrageobjekt (64 Objekte). Ergaenzt L9-14: grosse Abfragen der erweiterten DB
;   fuellen sonst die feste Ablage und der Parser schreibt nach 0 (exe+5E300B1).
[Knotenablage]
Aktiv=1

; [NamenLinie6] - L9-07b: Namensgrenzen wie Linie 6, Rueckfall wenn [Namensweiche] aus ist.
;   playernames 0..28999 (Vanilla), dcplayernames 29000..120000 (Grenze 3767 -> 91000).
;   Ist [Namensweiche] Aktiv=1, hat die Weiche Vorrang und L9-07b ruht.
[NamenLinie6]
Aktiv=1

; [Formationsgrenze] - L9-16: Grenze formations/customformations 900 -> 4096 (21 Stellen).
;   NUR zusammen mit der umgestellten DB (fifa_formation_4096.py) einschalten:
;   formations 0..4095, customformations ab 4096 (Meta rangelow 4096), Kopien entfernt.
;   Mit alter DB (Kopien in customformations, rangelow 0) bleibt Aktiv=0.
[Formationsgrenze]
Aktiv=1

