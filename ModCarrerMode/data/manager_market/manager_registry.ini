; Cadastro de técnicos do FIFA Friends.
; Edite uma seção por técnico. coach_id é estável; não reutilize IDs removidos.
; birth_date usa AAAA-MM-DD; a idade é calculada pela data da carreira.
; birthplace e nationality podem ficar vazios quando não houver fonte confiável.
; source_slc_club_id aponta para o SLC ORIGINAL: specificmanager_<ID>_0_<clima>.rx3.
; default_club_id define o clube inicial em novas carreiras; 0 significa sem vínculo inicial.
; market_enabled=false retira o técnico das novas contratações sem apagar histórico salvo.
; model_enabled=false deixa o perfil no mercado, mas usa o técnico genérico em campo.
; Novos modelos só funcionam se os quatro RX3 originais SLC existirem no jogo.

