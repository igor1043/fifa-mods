*{box-sizing:border-box}body{margin:0;background:#082f48;color:#334b56;font-family:Arial,"Segoe UI",sans-serif}header.review-toolbar{min-height:54px;display:flex;gap:18px;align-items:center;justify-content:space-between;padding:10px 24px;background:#f5f7f8;border-bottom:3px solid #0063b1;font-size:14px}header strong{font-size:16px}select,button{font:inherit;color:inherit}select{max-width:440px;padding:6px;border:1px solid #bccbd4;background:white}header label{display:flex;gap:9px;align-items:center}.review-note{font-size:12px;color:#667d89}#stage{display:block;width:min(100vw,calc((100vh - 58px)*16/9));margin:auto;outline:none}svg{display:block;width:100%;height:auto}svg text{pointer-events:none}g[data-action]{cursor:pointer;outline:none}.focus-ring{fill:none;stroke:#35b8ff;stroke-width:4;pointer-events:none}.busy{position:fixed;inset:54px 0 0;display:grid;place-items:center;background:#edf2f5dc;font-size:23px}.busy[hidden]{display:none}@media(max-width:740px){header.review-toolbar{flex-wrap:wrap;gap:7px;padding:8px 12px}.review-note{display:none}select{max-width:90vw}#stage{width:100vw}}
