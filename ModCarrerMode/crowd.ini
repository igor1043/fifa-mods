; FIFA 16 - Configuração da torcida / ocupação do estádio
; O plugin relê este arquivo durante a execução.
; Os valores são percentuais inteiros e não exigem recompilação.

[crowd]
; O controlador dinâmico acompanha o fator do próximo jogo e o publica como
; percentual inteiro pelo caminho estático já validado do plugin de torcida.
; Defina automatic_dynamic_controller=0 para um teste manual estático.
; Com o controlador automático desligado, -1 usa a lógica dinâmica do plugin;
; de 0 a 90 fixa o percentual. Fora da Carreira o fator original (0,90) retorna.
automatic_dynamic_controller=1
static_factor_percent=50

[crowd_weights]
; Pesos da lógica dinâmica original do plugin, preservados sem alteração.
; O controlador automático transfere o fator calculado no card e não modifica
; estes valores.
; Um peso 0,10 pode acrescentar até 10 pontos ao fator de público.
; Diminua um peso para reduzir sua influência; aumente para reforçá-la.

; Público básico de qualquer partida de Carreira.
base=0.10
; Prestígio do clube. A curva é mais exigente com clubes pequenos.
team_reputation=0.30
; Prestígio do adversário: receber um clube grande atrai mais público.
opponent_reputation=0.08
; Posição na liga. O efeito cresce conforme a temporada avança.
league_position=0.12
; Aproveitamento nos últimos cinco jogos.
recent_form=0.06
; Último resultado, goleada e sequência de vitórias ou derrotas.
last_results=0.07
; Briga por título, permanência, mata-mata e reta final.
match_importance=0.10
; Prestígio da liga do clube. Liga forte ajuda clubes pequenos.
league_reputation=0.12
; Prestígio estimado da competição usando os clubes participantes.
competition_prestige=0.10
; Bônus do controlador automático para o próximo jogo internacional real.
; 0.06 acrescenta 6 pontos percentuais, respeitando o teto normal de 90.
; Liga/copa nacional e pré-temporada não recebem este bônus.
international_competition_bonus=0.06
; Clássico ou rivalidade cadastrada no banco do FIFA.
rivalry=0.08
; Chance real de um clube tradicional escapar do rebaixamento na reta final.
escape_opportunity=0.08
; Redução para clube de baixa reputação em risco tardio de rebaixamento.
relegation_penalty=0.10
; Redução geral para clube pequeno em partida comum e competição fraca.
; Liga forte, competição forte, semifinal e final aliviam esta redução.
low_reputation_penalty=0.12

; Bônus especiais. Semifinal e final ignoram o teto de partida comum.
semifinal_bonus=0.28
final_bonus=0.38
; Última rodada recebe mais público, principalmente se a partida for decisiva.
last_round_bonus=0.14

; Teto inicial de uma partida comum para um clube sem prestígio: 30%.
regular_match_base_limit_percent=30
; Prestígio do clube, da liga, da competição e do adversário pode acrescentar
; até 40 pontos. Assim, um clube de elite chega a 70% em partida comum.
elite_prestige_limit_bonus_percent=40
; Má fase pode retirar até 20 pontos do teto. Boa fase não ultrapassa os 70%.
bad_form_limit_penalty_percent=20
; Um clássico forte é uma exceção e pode elevar o teto em até mais 12 pontos.
rivalry_limit_bonus_percent=12
; Teto da semifinal. Ela pode ficar muito cheia, mas não é a final.
semifinal_maximum_percent=82
; Teto da última rodada da liga. Só sobe até aqui, mesmo sendo decisiva.
last_round_maximum_percent=78
; Piso da final. 90 equivale ao valor original cheio do FIFA.
final_minimum_percent=90

; Piso dinâmico 0,09: cerca de 10% do valor original 0,90.
minimum_dynamic_percent=9
; Teto normal do FIFA 16 para este atributo.
maximum_dynamic_percent=90

[competition_attendance]
; Pontos adicionais e pisos por identidade real da proxima competicao.
; Mata-mata: oitavas/quartas +4 no piso; semifinal +8; final 90.
; Teto padrao 88, respeitando maximum_dynamic_percent.
libertadores_bonus_percent=22
libertadores_minimum_percent=75
sudamericana_bonus_percent=16
sudamericana_minimum_percent=70
recopa_bonus_percent=20
recopa_minimum_percent=78
international_bonus_percent=14
international_minimum_percent=68
brasileirao_a_bonus_percent=14
brasileirao_a_minimum_percent=68
brasileirao_b_bonus_percent=10
brasileirao_b_minimum_percent=60
copa_brasil_bonus_percent=16
copa_brasil_minimum_percent=70
brasileirao_c_bonus_percent=8
brasileirao_c_minimum_percent=50
brasileirao_d_bonus_percent=6
brasileirao_d_minimum_percent=42
estadual_bonus_percent=7
estadual_minimum_percent=52
domestic_bonus_percent=4
