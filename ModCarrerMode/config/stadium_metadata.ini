; Nome exato da pasta/pacote em StadiumGBD, nao o ID do slot nativo.
; Valores ausentes ficam vazios na panoramica. Nao ha estimativa automatica.
; capacity = capacidade total. attendance = publico informado, em pessoas.
; Exemplo (descomente e substitua pelos dados reais do seu estadio):
; [Nome do estadio customizado]
; capacity=50000
; attendance=42000
;
; Tambem aceitos no pacote: metadata.ini ou stadium.ini, secao [stadium].
; name=Nome do estadio customizado
; capacity=50000
; attendance=42000
; Ou FSW/settings.ini: [stadiumcapacity] e [stadiumattendance], chave=nome do pacote.
