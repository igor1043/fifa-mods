[overlay]
; In-process experimental ranking overlay. Set 0 to disable it.
enabled=1
;
; Open: select the Ranking Mundial card in Career Central.
; The card sends its own native action and keeps the Hub underneath the list.
; No native notes screen or copied view is used as an opening trigger.
; Shortcuts: Xbox LB + RB + View together, or F10 on keyboard.
; Close: Xbox B, Escape, or F10. All other input is swallowed while open.
; Shared modal host: registered screens own keyboard, mouse and XInput input.
; Closing keeps a 250 ms release guard; held controls require physical release.
